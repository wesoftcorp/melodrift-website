<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Melodrift...</title>
  <script>
    // GitHub Pages SPA router - captures /play or query params and forwards seamlessly
    const currentUrl = new URL(window.location.href);
    if (currentUrl.pathname.includes('/play') || currentUrl.searchParams.has('id')) {
      window.location.replace('/play.html' + currentUrl.search);
    } else {
      window.location.replace('/' + currentUrl.search);
    }
  </script>
  <style>
    body {
      background: #070913;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 95, 31, 0.2);
      border-top-color: #FF5F1F;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h2 style="margin: 0 0 8px; font-weight: 700;">Tuning into Melodrift...</h2>
    <p style="margin: 0; color: rgba(255, 255, 255, 0.6); font-size: 14px;">Redirecting to song player...</p>
  </div>
</body>
</html>
